- hosts: all
  tasks:
    - name: import role provision_cluster
      import_role:
        name: opensvc.cluster.provision_cluster
      vars:
        provision_cluster_osvc_clustername: testcluster
        provision_cluster_osvc_hb_timeout: 25s
        provision_cluster_osvc_update_etc_hosts: true
        provision_cluster_osvc_configure_webapp: true
        provision_cluster_osvc_configure_vip: true
        provision_cluster_osvc_cluster_vip_addr: '1.2.3.4'
        provision_cluster_osvc_cluster_vip_cidr_subnet: '24'
        provision_cluster_osvc_cluster_vip_nic_name: 'vippe'
        provision_cluster_osvc_node_prd_nic: 'enp1s0'
        provision_cluster_osvc_vip_external_fqdn: 'vip-cluster.opensvc.org'
        provision_cluster_osvc_webapp_user: 'webadmin'
        provision_cluster_osvc_webapp_password: 's3cr3t'
        provision_cluster_osvc_ca_cert_name: 'TEST CLUSTER'
        provision_cluster_osvc_ca_cert_country: 'FR'
        provision_cluster_osvc_ca_cert_org: 'The Cluster Company'

    - name: import role install_cni
      import_role:
        name: opensvc.cluster.install_cni
      vars:
        install_cni_osvc_cni_plugins_dir: /opt/cni/bin
        install_cni_osvc_cni_config_dir: /var/lib/opensvc/cni/net.d

    - name: import role install_backend_network
      import_role:
        name: opensvc.cluster.install_backend_network
      vars:
        install_backend_network_osvc_backend_subnet_name: backendipv4
        install_backend_network_osvc_backend_subnet_range: 10.123.0.0/16
        install_backend_network_osvc_backend_subnet_ips_per_node: 4096

    - name: import role install_backend_network
      import_role:
        name: opensvc.cluster.install_backend_network
      vars:
        install_backend_network_osvc_backend_subnet_name: backendipv6
        install_backend_network_osvc_backend_subnet_range: fdfe::/112
        install_backend_network_osvc_backend_subnet_ips_per_node: 1024

    - name: import role install_drbd
      import_role:
        name: opensvc.cluster.install_drbd

    - name: import role install_dns
      import_role:
        name: opensvc.cluster.install_dns
