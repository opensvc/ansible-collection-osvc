---
ancestor: null
releases:
  1.0.0:
    changes:
      bugfixes:
        - Fix deprecated syntax.
        - Fix linting and sanity errors.
      minor_changes:
        - Red Hat Ansible Automation Platform is ending support for Ansible Core 2.15
          and Python 3.11.
        - Set minimum ansible version to 2.16.0.
    release_date: '2026-05-18'
  1.1.0:
    changes:
      bugfixes:
        - 'Install_pool, install_backend_network: detect existing objects from ``om
          ... ls -o json``.'
        - 'Provision_cluster, install_drbd: use the package module instead of dnf,
          for RHEL 7 support.'
        - RHEL 7 and RHEL 8 nodes need ansible-core <= 2.16 (python 3.6 targets),
          see README.
        - Set ``requires_ansible`` to ``>=2.16.0``, as required by Red Hat certification.
        - install_dns - prefix role variables with ``install_dns_``.
        - install_drbd - detect a loaded module from /sys/module, ``lsmod | grep -q``
          under pipefail reported it as missing and reloaded it on every run.
        - install_pool - use ``om cluster config update --set``.
        - provision_cluster - compute the package repository path per distribution
          and release (Debian repository path was missing the release codename).
        - provision_cluster - disable repository gpgcheck on RHEL 7, as rpm 4.11 can
          not verify subkey signatures.
        - provision_cluster - display the join token only with ``-vv``.
        - provision_cluster - install jq on Debian and Ubuntu, remove python3-netaddr.
        - provision_cluster - pass the join token through ``OSVC_JOIN_TOKEN``, ``--token``
          now expects a file path.
        - provision_cluster - ssh trust, hb timeout, cluster thaw and apt cache update
          no longer report a change on every run.
        - provision_cluster - use a deb822 signed repository on Ubuntu.
      minor_changes:
        - New role install_hb_relay, to add a relay heartbeat to the cluster.
        - install_backend_network - ``install_backend_network_subnet_ips_per_node``
          is replaced by ``install_backend_network_subnet_mask_per_node`` (per-node
          subnet prefix length, default 24).
        - install_pool - ``osvc_pool_path`` is now ``install_pool_path``, ``osvc_pool_vg``
          is now ``install_pool_vg``.
        - install_pool - add ``vg`` pool type and ``install_pool_force`` to overwrite
          an existing pool.
        - provision_cluster - install a given OpenSVC version with ``provision_cluster_version``
          (server and client pinned), downgrades require ``provision_cluster_allow_downgrade``,
          freeze the cluster before and thaw it only once all nodes have rejoined.
        - provision_cluster - set the ``hb#1.timeout`` keyword from ``provision_cluster_hb_timeout``.
    release_date: '2026-09-25'
  1.2.0:
    changes:
      breaking_changes:
        - unprovision_cluster - the OpenSVC configuration and data are kept, unless
          ``unprovision_cluster_purge`` is set to ``true``.
        - unprovision_services - the role lists the objects to purge and fails without
          changing anything, unless ``unprovision_services_confirm`` is set to ``true``.
      bugfixes:
        - unprovision_cluster - fail when services or volumes are still defined on
          the cluster.
        - unprovision_cluster - remove opensvc-client too, drop the v2 daemon shutdown
          tasks.
        - 'unprovision_services - keep the objects the cluster needs: cluster, ``system/sec/ca``,
          ``system/sec/cert``, ``system/sec/hb``, ``system/sec/relay``, the secrets
          referenced by relay heartbeats, and the users. The hb secret was purged,
          breaking the heartbeats at the next daemon restart.'
        - unprovision_services - purge volumes after the services holding them.
        - unprovision_services - remove the ``cluster.vip`` tasks, deprecated in OpenSVC
          v3.
        - unprovision_services - thaw the cluster after the purge, unless it was frozen
          before.
    release_date: '2026-09-26'
  1.3.0:
    changes:
      bugfixes:
        - install_drbd - the daemon restart handler used the OpenSVC v2 ``om node
          wait`` command.
        - install_hb_relay - do not wait for the relay heartbeat to beat on a single
          node cluster, which never reports it beating.
        - provision_cluster - ignore the play hosts without ``provision_cluster_downgrade``
          when detecting a downgrade in the cluster.
        - 'provision_cluster - the waits for the node monitor idle state and for the
          vip instance up state did not wait: their event filter data assertions lacked
          the leading dot.'
        - roles tests - call the roles by FQCN, and the install_pool test now runs
          install_pool.
      minor_changes:
        - 'Documentation - README: describe the collection, add the support and release
          notes sections.'
        - 'Documentation - README: document the ansible-core and managed nodes python
          compatibility.'
        - 'Documentation - install_drbd: document the DRBD 9 sources and variables.'
        - Roles metadata - declare the tested platforms, EL 7 to 10 and Ubuntu 20.04
          to 26.04, instead of all the Fedora, EL, Debian and Ubuntu versions.
        - 'Use the current OpenSVC v3 commands instead of the deprecated or hidden
          aliases: ``om daemon events``, ``om daemon auth --role join`` (join token
          valid 10 minutes instead of 1), ``om cluster config get`` and ``om cluster
          config update --set``, ``unfreeze``, ``key add/decode/change <key>``, ``om
          daemon hb list``.'
        - install_drbd - install DRBD 9 when no drbd 9 module is installed, from the
          LINBIT ppa on Ubuntu >= 22.04, or from ELRepo on RHEL 8, 9 and 10. The role
          only loaded an already installed module.
        - 'install_drbd - new ``install_drbd_linbit_key`` variable, the confidential
          LINBIT enabler code: when set, DRBD 9 is installed from the official LINBIT
          customer repositories (Ubuntu, Debian, RHEL 7 to 10). The tasks using it
          are hidden from the logs, and the repository files are readable by root
          only.'
        - provision_cluster, install_dns - the event filters select the nodes by hostname,
          like the OpenSVC node names.
      release_summary: install_drbd now installs DRBD 9 when it is missing, from the
        LINBIT ppa, ELRepo or the official LINBIT repositories. The roles use the
        current OpenSVC v3 commands, and the waits on the node and vip states are
        fixed.
    fragments:
      - 1.3.0.yml
    release_date: '2026-10-11'
  1.3.1:
    changes:
      bugfixes:
        - Use the ``ansible_facts`` dictionary instead of the top-level fact variables,
          removing the ``INJECT_FACTS_AS_VARS`` deprecation warning of ansible-core
          2.20 and later.
        - provision_cluster - without ``provision_cluster_vip_dev``, the vip interface
          detection picked the wrong ip when ``/etc/hosts`` listed a loopback address
          or an alias like ``hb1-<hostname>`` for the node name, and found none when
          the node name preceded the fqdn. The node production ip lookup now matches
          the exact node name and skips the loopback addresses.
      release_summary: 'Bugfix release: the roles no longer rely on the top-level
        fact variables deprecated by ansible-core 2.20, and the cluster vip interface
        detection matches the exact node name.'
    fragments:
      - facts-namespace.yml
      - release-summary.yml
      - vip-prd-ip-lookup.yml
    release_date: '2026-10-12'
  1.4.0:
    changes:
      bugfixes:
        - install_cni - the ``cni.plugins`` and ``cni.config`` cluster keywords were
          not set when the plugins were already in ``install_cni_plugins_dir``, and
          an interrupted download or extraction was never resumed.
        - install_dns - ``install_dns_use_ip_from_ansible_host`` failed with an ``extract()``
          error, and now uses the ``ansible_host`` variable.
        - install_dns - an empty ``install_dns_cfg_recursor_allowed_subnets`` added
          a trailing comma to the recursor ``allow-from`` setting.
        - install_dns - the ``cluster.dns`` keyword of each node was set from the
          node itself, one node at a time with a 5 seconds sleep between them, to
          avoid concurrent cluster configuration updates. All the nodes keywords are
          now set in one update from the first node.
        - install_dns - the debug tasks printed their message at the default verbosity,
          they now need ``-vv``.
        - install_dns - the dns configmap existence check ignored ``install_dns_cfgmap_name``.
        - install_dns - the recursor configuration was edited in ``/tmp/recursor``,
          left on the first node. It is now edited in a temporary file removed once
          the configmap key is set, and ``/tmp/recursor`` is removed.
        - install_drbd - failed on the nodes with a DRBD 9 built from the sources,
          which installs no ``drbd.service`` systemd unit.
        - install_drbd - the DRBD version check read the module file on disk, so a
          DRBD 8.4 module loaded before the DRBD 9 installation was accepted. The
          loaded module version is checked, and a loaded DRBD 8.4 module is replaced
          when not in use.
        - install_drbd - the ELRepo release package was installed without checking
          its signature. The ELRepo signing key is now imported, checked by its fingerprint
          (``install_drbd_elrepo_keys``).
        - install_drbd - the drbd devices rejection was added as a second ``filter``
          line when ``/etc/lvm/lvm.conf`` already had an active filter. It is now
          prepended to the active filter.
        - install_hb_relay - the wait for the heartbeat to beat read the output of
          om daemon hb list without its items list, and never succeeded on a cluster
          of several nodes.
        - install_pool, install_backend_network - the existence check did not parse
          the current ``om pool ls`` and ``om net ls`` json output, so the pool and
          the network were configured again on each run.
        - provision_cluster - a node whose name is a prefix of a cluster node name,
          like ``node1`` and ``node10``, was considered as already joined, and a node
          whose inventory name is not its hostname was joined again on each run. The
          joined nodes are now compared by hostname.
        - provision_cluster - each run on several nodes unfroze all the frozen nodes,
          including the ones frozen by an operator. Only the nodes frozen by the role
          for a downgrade are unfrozen now.
        - provision_cluster - the Debian repository was declared unsigned, with ``[trusted=yes]``.
          It is now checked with the OpenSVC signing key, like the Ubuntu one, and
          the unsigned declaration is removed.
        - provision_cluster - the git hash was not removed from the versions before
          comparing them, so two builds of the same release could be detected as a
          downgrade, and refused unless ``provision_cluster_allow_downgrade`` was
          set.
        - provision_cluster - the repository url was empty and the install tasks file
          missing on SLES.
        - provision_cluster - with ``provision_cluster_configure_ssh_trust``, the
          root login setting was only changed in ``/etc/ssh/sshd_config``, while the
          ``sshd_config.d`` files it includes take precedence, like the ``01-permitrootlogin.conf``
          file of RHEL 9 and 10 allowing the root login with a password. It is now
          set in ``sshd_config.d/00-opensvc.conf`` too, the files are validated with
          ``sshd -t``, ``PermitRootLogin no`` is replaced too, and the effective setting
          is checked.
        - provision_cluster - with ``provision_cluster_configure_ssh_trust``, the
          root login was left allowed with a password on RHEL 7, whose sshd has no
          ``Include`` and allows it by default. ``PermitRootLogin prohibit-password``
          is now added at the top of ``/etc/ssh/sshd_config`` when it neither includes
          ``sshd_config.d`` nor sets it.
        - unprovision_cluster - the defined services were not checked when no daemon
          was running. They are now looked up in the object configuration files.
      minor_changes:
        - all roles - removed the ``.travis.yml`` and ``tests/`` skeletons of the
          roles, and the unused handlers and ``install_drbd_debian_repo``, ``install_drbd_debian_version``
          variables of install_drbd.
        - install_cni - the flannel plugin is no longer required.
        - install_cni - use the CNI plugins already present on the nodes, like the
          ones of the containernetworking-plugins packages (``/usr/lib/cni``, ``/usr/libexec/cni``),
          instead of downloading them. The new ``install_cni_force`` variable downloads
          them anyway, and the new ``install_cni_search_dirs`` variable lists the
          directories looked up.
        - install_drbd - set ``use_devicesfile = 0`` in ``/etc/lvm/lvm.conf``, as
          OpenSVC nodes do not use the LVM devices file, enabled by default on recent
          RHEL and SLES, which ignores the drbd devices filter.
        - install_drbd - support SLES 15 and 16, from the LINBIT repositories when
          ``install_drbd_linbit_key`` is set, else from the enabled repositories (SLE
          High Availability extension).
        - install_hb_disk - new role, adding a disk heartbeat. The disk is checked
          on every node, signed once when it is not signed yet, and a disk holding
          data or a known signature is refused unless forced.
        - install_hb_unicast - new role, adding a unicast heartbeat with the address,
          and optionally the interface, of each node. A port already used by another
          unicast heartbeat of the cluster is refused.
        - install_pool - new ``install_pool_keywords`` variable, a dictionary of other
          pool keywords, like ``quota``, ``thin_pool`` or ``fs_type``.
        - install_pool - update the keywords of an existing pool whose value differs
          from the role variables, instead of leaving it as is unless ``install_pool_force``
          is set, which now sets all the keywords. Configure loop, shm, virtual and
          zpool pools too, refuse the other types, and check the mandatory keywords
          of the vg, zpool and virtual pools.
        - install_quorum - new role, configuring the cluster quorum, the arbitrators
          and, optionally, the split action. The arbitrators must be seen up from
          every node before the quorum is enabled. With an even number of nodes, a
          setup losing a split in two equal parts is refused, with no arbitrator,
          or with several arbitrators of which the loss of one loses it.
        - provision_cluster - select the tasks and the repository by OS family.
        - provision_cluster - set the sysrq trigger with ansible.builtin modules,
          the collection no longer depends on ansible.posix.
        - provision_cluster - support Debian 12 and 13, with the Ubuntu tasks.
        - provision_cluster - support SLES 15 and 16, from the ``<env>-opensvc-v3-sles15``
          and ``<env>-opensvc-v3-sles16`` repositories. ansible.builtin has no zypper
          module, so the repository is a ``/etc/zypp/repos.d/opensvc.repo`` file and
          the packages are installed with the ``zypper`` command.
        - provision_cluster - the ``provision_cluster_opensvc_command_delay`` variable
          is removed, it was the sleep after each node join. The role now waits for
          the joined node monitor to be idle.
        - unprovision_cluster - remove the OpenSVC packages on SLES.
        - unprovision_cluster - with ``unprovision_cluster_purge``, also remove the
          files added by provision_cluster, the OpenSVC package repository, the sysrq
          setting, the ``/etc/hosts`` block and the docker daemon configuration it
          installed.
      release_summary: Support of RHEL 8, 9 and 10, Ubuntu 22.04, 24.04 and 26.04,
        SLES 15 and 16, and Debian 12 and 13, with ansible.builtin modules only. New
        roles install_quorum, install_hb_unicast and install_hb_disk. The roles are
        idempotent, and many fixes, of the sshd root login setting, the ELRepo key
        check, the Debian repository signature, the join and dns waits, and the relay
        heartbeat wait among them.
    fragments:
      - enterprise-distros.yml
      - install-hb.yml
      - install-quorum.yml
      - release-summary.yml
    release_date: '2026-11-09'
  1.5.0:
    changes:
      bugfixes:
        - install_hb_unicast, install_hb_disk - with ansible-core 2.21 and later,
          the roles succeeded when the heartbeat did not beat on every node at the
          end of the wait, as ansible-core now marks a task out of retries with ``failed_when``
          false as succeeded. The wait condition is now checked again after the wait.
      minor_changes:
        - README - add the Installation section, focused on Red Hat Ansible Automation
          Hub, and the License information section, linking to the LICENSE file. Also
          add the Description, Requirements, Use cases, Testing, Related information
          sections, and a link to the platform life cycle.
        - install_hb_multicast - new role, adding a multicast heartbeat to the cluster,
          with an optional interface per node. It refuses a group and port pair already
          used by another multicast heartbeat, and waits for the heartbeat to beat
          on every node.
      release_summary: New role install_hb_multicast. The README follows the certified
        collection README template, with an Installation section focused on Red Hat
        Ansible Automation Hub and a License information section. The heartbeat roles
        fail again when the heartbeat does not beat, with ansible-core 2.21 and later.
    fragments:
      - hb-wait-core-2.21.yml
      - install-hb-multicast.yml
      - readme-certification.yml
      - release-1.5.0.yml
    release_date: '2026-11-10'
