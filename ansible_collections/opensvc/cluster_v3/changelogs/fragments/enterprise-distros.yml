---
minor_changes:
  - provision_cluster - support SLES 15 and 16, from the
    ``<env>-opensvc-v3-sles15`` and ``<env>-opensvc-v3-sles16`` repositories.
    ansible.builtin has no zypper module, so the repository is a
    ``/etc/zypp/repos.d/opensvc.repo`` file and the packages are installed
    with the ``zypper`` command.
  - provision_cluster - select the tasks and the repository by OS family.
  - provision_cluster - support Debian 12 and 13, with the Ubuntu tasks.
  - install_drbd - support SLES 15 and 16, from the LINBIT repositories when
    ``install_drbd_linbit_key`` is set, else from the enabled repositories
    (SLE High Availability extension).
  - unprovision_cluster - remove the OpenSVC packages on SLES.
  - install_drbd - set ``use_devicesfile = 0`` in ``/etc/lvm/lvm.conf``, as
    OpenSVC nodes do not use the LVM devices file, enabled by default on
    recent RHEL and SLES, which ignores the drbd devices filter.
  - install_pool - update the keywords of an existing pool whose value
    differs from the role variables, instead of leaving it as is unless
    ``install_pool_force`` is set, which now sets all the keywords.
    Configure loop, shm, virtual and zpool pools too, refuse the other
    types, and check the mandatory keywords of the vg, zpool and virtual
    pools.
  - install_pool - new ``install_pool_keywords`` variable, a dictionary of
    other pool keywords, like ``quota``, ``thin_pool`` or ``fs_type``.
  - install_cni - use the CNI plugins already present on the nodes, like the
    ones of the containernetworking-plugins packages (``/usr/lib/cni``,
    ``/usr/libexec/cni``), instead of downloading them. The new
    ``install_cni_force`` variable downloads them anyway, and the new
    ``install_cni_search_dirs`` variable lists the directories looked up.
  - install_cni - the flannel plugin is no longer required.
  - unprovision_cluster - with ``unprovision_cluster_purge``, also remove the
    files added by provision_cluster, the OpenSVC package repository, the
    sysrq setting, the ``/etc/hosts`` block and the docker daemon
    configuration it installed.
bugfixes:
  - provision_cluster - each run on several nodes unfroze all the frozen
    nodes, including the ones frozen by an operator. Only the nodes frozen
    by the role for a downgrade are unfrozen now.
  - unprovision_cluster - the defined services were not checked when no
    daemon was running. They are now looked up in the object configuration
    files.
  - provision_cluster - the Debian repository was declared unsigned, with
    ``[trusted=yes]``. It is now checked with the OpenSVC signing key, like
    the Ubuntu one, and the unsigned declaration is removed.
  - provision_cluster - the repository url was empty and the install tasks
    file missing on SLES.
  - provision_cluster - a node whose name is a prefix of a cluster node name,
    like ``node1`` and ``node10``, was considered as already joined, and a
    node whose inventory name is not its hostname was joined again on each
    run. The joined nodes are now compared by hostname.
  - install_dns - ``install_dns_use_ip_from_ansible_host`` failed with an
    ``extract()`` error, and now uses the ``ansible_host`` variable.
  - install_dns - the dns configmap existence check ignored
    ``install_dns_cfgmap_name``.
  - install_pool, install_backend_network - the existence check did not
    parse the current ``om pool ls`` and ``om net ls`` json output, so the
    pool and the network were configured again on each run.
  - install_drbd - the DRBD version check read the module file on disk, so a
    DRBD 8.4 module loaded before the DRBD 9 installation was accepted. The
    loaded module version is checked, and a loaded DRBD 8.4 module is
    replaced when not in use.
  - install_drbd - the drbd devices rejection was added as a second
    ``filter`` line when ``/etc/lvm/lvm.conf`` already had an active filter.
    It is now prepended to the active filter.
  - install_cni - the ``cni.plugins`` and ``cni.config`` cluster keywords
    were not set when the plugins were already in ``install_cni_plugins_dir``,
    and an interrupted download or extraction was never resumed.
  - install_drbd - failed on the nodes with a DRBD 9 built from the sources,
    which installs no ``drbd.service`` systemd unit.
  - provision_cluster - the git hash was not removed from the versions
    before comparing them, so two builds of the same release could be
    detected as a downgrade, and refused unless
    ``provision_cluster_allow_downgrade`` was set.
