---
# defaults file for unprovision_services

# the role purges services, it only acts when this is set to true
unprovision_services_confirm: false

# Time to wait actual service purge to be done
unprovision_services_purge_wait_time: 120s

# Check 10 times if services are actually purged, and wait 10s between retries
unprovision_services_purge_retries: 10
unprovision_services_purge_delay: 10
