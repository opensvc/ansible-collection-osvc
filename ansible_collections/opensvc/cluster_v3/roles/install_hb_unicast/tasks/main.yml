---
# tasks file for install_hb_unicast

- name: Check the heartbeat parameters
  ansible.builtin.assert:
    that:
      - install_hb_unicast_rid | string is match('^[A-Za-z0-9_-]+$')
      - install_hb_unicast_state in ['present', 'absent']
      - install_hb_unicast_port | string is match('^([0-9]+)?$')
    fail_msg: >-
      install_hb_unicast_rid must be set, made of letters, digits, - and _,
      install_hb_unicast_state must be present or absent, and
      install_hb_unicast_port must be empty or a port number
    quiet: true
  run_once: true

# om names the nodes by their lowercased short hostname
- name: Get the node names
  ansible.builtin.setup:
    gather_subset: [min]
  when: ansible_facts['hostname'] is not defined

- name: Get the cluster configuration
  ansible.builtin.command: om cluster config show
  register: install_hb_unicast_config_show
  changed_when: false
  run_once: true

# section => {keyword: value}, from the ini text
- name: Parse the cluster configuration
  ansible.builtin.set_fact:
    install_hb_unicast_config: >-
      {%- set out = {} -%}
      {%- set ns = namespace(section='') -%}
      {%- for line in install_hb_unicast_config_show.stdout_lines -%}
      {%- if line[:1] == '[' and ']' in line -%}
      {%- set ns.section = line[1 : line.index(']')] -%}
      {%- set _ = out.update({ns.section: {}}) -%}
      {%- elif ns.section and line is match('^[^#;=]+=') -%}
      {%- set kv = line.split('=', 1) -%}
      {%- set _ = out[ns.section].update({kv[0] | trim: kv[1] | trim}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    install_hb_unicast_section: "hb#{{ install_hb_unicast_rid }}"
  run_once: true

- name: Remove the heartbeat
  ansible.builtin.command:
    argv:
      - om
      - cluster
      - config
      - update
      - "--delete={{ install_hb_unicast_section }}"
  register: install_hb_unicast_delete
  changed_when: install_hb_unicast_delete.rc == 0
  run_once: true
  when:
    - install_hb_unicast_state == 'absent'
    - install_hb_unicast_section in install_hb_unicast_config

- name: Configure the heartbeat
  when: install_hb_unicast_state == 'present'
  block:
    # node name => address and interface, from the host variables of the
    # play hosts. The other unicast heartbeats listening on the same port,
    # on all the addresses unless scoped, prevent this one from listening.
    - name: Set the heartbeat facts
      ansible.builtin.set_fact:
        install_hb_unicast_cluster_nodes: "{{ _cluster_nodes }}"
        install_hb_unicast_hb_nodes: >-
          {{ install_hb_unicast_nodes | map('lower') | list
             if install_hb_unicast_nodes | length > 0 else _cluster_nodes }}
        install_hb_unicast_addrs: >-
          {%- set out = {} -%}
          {%- for h in ansible_play_hosts -%}
          {%- if hostvars[h].install_hb_unicast_addr | default('') -%}
          {%- set _ = out.update({
                hostvars[h].ansible_facts.hostname | lower:
                hostvars[h].install_hb_unicast_addr}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
        install_hb_unicast_intfs: >-
          {%- set out = {} -%}
          {%- for h in ansible_play_hosts -%}
          {%- if hostvars[h].install_hb_unicast_intf | default('') -%}
          {%- set _ = out.update({
                hostvars[h].ansible_facts.hostname | lower:
                hostvars[h].install_hb_unicast_intf}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
        install_hb_unicast_port_users: >-
          {%- set out = [] -%}
          {%- for name, kw in install_hb_unicast_config.items() -%}
          {%- if name is match('^hb#') and name != install_hb_unicast_section
                and kw.type | default('') == 'unicast'
                and kw.port | default('10000') == _port -%}
          {%- set _ = out.append(name) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
      vars:
        _cluster_nodes: >-
          {{ install_hb_unicast_config.cluster.nodes | default('') | split }}
        _port: "{{ install_hb_unicast_port | string or '10000' }}"
      run_once: true

    - name: Check the heartbeat setup
      ansible.builtin.assert:
        that:
          - _type in ['', 'unicast']
          - _unknown | length == 0
          - _missing | length == 0
          - install_hb_unicast_port_users | length == 0
        fail_msg: >-
          {{ install_hb_unicast_section }}:
          {{ 'it is a ' ~ _type ~ ' heartbeat. '
             if _type not in ['', 'unicast'] else '' }}
          {{- 'not cluster nodes: ' ~ _unknown | join(', ') ~ '. '
              if _unknown else '' }}
          {{- 'no install_hb_unicast_addr host variable for the nodes: '
              ~ _missing | join(', ') ~ '. ' if _missing else '' }}
          {{- 'the port is used by ' ~ install_hb_unicast_port_users
              | join(', ') ~ ': set install_hb_unicast_port.'
              if install_hb_unicast_port_users else '' }}
        quiet: true
      vars:
        _type: >-
          {{ install_hb_unicast_config[install_hb_unicast_section].type
             | default('')
             if install_hb_unicast_section in install_hb_unicast_config
             else '' }}
        _unknown: >-
          {{ install_hb_unicast_hb_nodes
             | difference(install_hb_unicast_cluster_nodes) }}
        _missing: >-
          {{ install_hb_unicast_hb_nodes
             | difference(install_hb_unicast_addrs.keys() | list) }}
      run_once: true

    # the addresses and interfaces are scoped to each node
    - name: Set the desired heartbeat keywords
      ansible.builtin.set_fact:
        install_hb_unicast_desired: >-
          {%- set s = install_hb_unicast_section ~ '.' -%}
          {%- set out = [s ~ 'type=unicast'] -%}
          {%- for kw in ['port', 'timeout', 'interval'] -%}
          {%- set v = lookup('vars', 'install_hb_unicast_' ~ kw) | string -%}
          {%- if v -%}{%- set _ = out.append(s ~ kw ~ '=' ~ v) -%}{%- endif -%}
          {%- endfor -%}
          {%- if install_hb_unicast_nodes -%}
          {%- set _ = out.append(s ~ 'nodes='
                ~ install_hb_unicast_hb_nodes | join(' ')) -%}
          {%- endif -%}
          {%- for n in install_hb_unicast_hb_nodes -%}
          {%- set _ = out.append(s ~ 'addr@' ~ n ~ '='
                ~ install_hb_unicast_addrs[n]) -%}
          {%- if n in install_hb_unicast_intfs -%}
          {%- set _ = out.append(s ~ 'intf@' ~ n ~ '='
                ~ install_hb_unicast_intfs[n]) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    - name: Get the current heartbeat keywords
      ansible.builtin.command:
        argv: >-
          {{ ['om', 'cluster', 'config', 'get', '-o', 'json']
             + (install_hb_unicast_desired
                | map('regex_replace', '=.*$', '')
                | map('regex_replace', '^', '--kw=') | list) }}
      register: install_hb_unicast_current
      changed_when: false
      run_once: true

    - name: Configure the heartbeat keywords
      ansible.builtin.command:
        argv: >-
          {{ ['om', 'cluster', 'config', 'update']
             + (_updates | map('regex_replace', '^', '--set=') | list) }}
      register: install_hb_unicast_update
      changed_when: install_hb_unicast_update.rc == 0
      run_once: true
      when: _updates | length > 0
      vars:
        _items: "{{ (install_hb_unicast_current.stdout | from_json)['items'] }}"
        _current: >-
          {{ _items | map(attribute='keyword')
             | zip(_items | map(attribute='value'))
             | map('join', '=') | list }}
        _updates: "{{ install_hb_unicast_desired | difference(_current) }}"

    # each node of the heartbeat runs a receiver and a sender, reported
    # per peer: a receiver failing to listen leaves the sender beating
    - name: Wait for the heartbeat to beat on every node
      ansible.builtin.command: om daemon hb list -o json
      register: install_hb_unicast_status
      changed_when: false
      failed_when: false
      retries: >-
        {{ (install_hb_unicast_wait_timeout | int / 5) | round(0, 'ceil')
           | int }}
      delay: 5
      until: >-
        install_hb_unicast_status.rc == 0
        and _items | rejectattr('state', 'equalto', 'running') | list
            | length == 0
        and _items | rejectattr('is_beating') | list | length == 0
        and _items | selectattr('id', 'match', '.*[.]rx$')
            | map(attribute='node') | unique | length == _count | int
        and _items | selectattr('id', 'match', '.*[.]tx$')
            | map(attribute='node') | unique | length == _count | int
      vars:
        _count: "{{ install_hb_unicast_hb_nodes | length }}"
        _items: >-
          {{ (install_hb_unicast_status.stdout | default('{}', true)
              | from_json)['items'] | default([])
             | selectattr('id', 'in', [install_hb_unicast_section ~ '.rx',
                                       install_hb_unicast_section ~ '.tx'])
             | selectattr('node', 'in', install_hb_unicast_hb_nodes)
             | list }}
      run_once: true
      when: install_hb_unicast_hb_nodes | length > 1

    - name: Check the heartbeat beats on every node
      ansible.builtin.assert:
        that: install_hb_unicast_status is succeeded
        fail_msg: >-
          {{ install_hb_unicast_section }} does not beat on every node after
          {{ install_hb_unicast_wait_timeout }}s:
          {{ _items | map(attribute='id')
             | zip(_items | map(attribute='node'),
                   _items | map(attribute='state'),
                   _items | map(attribute='is_beating')
                   | map('ternary', 'beating', 'not beating'))
             | map('join', ' ') | join(', ') }}
        quiet: true
      vars:
        _items: >-
          {{ (install_hb_unicast_status.stdout | default('{}', true)
              | from_json)['items'] | default([])
             | selectattr('id', 'in', [install_hb_unicast_section ~ '.rx',
                                       install_hb_unicast_section ~ '.tx'])
             | list }}
      run_once: true
      when: install_hb_unicast_hb_nodes | length > 1
