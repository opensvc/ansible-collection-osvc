---
# tasks file for install_backend_network
#
- name: List configured networks
  ansible.builtin.command: om net ls -o json
  changed_when: false
  register: install_backend_network_list
  run_once: true

- name: Set fact on actual network existence
  ansible.builtin.set_fact:
    install_backend_network_created: >-
      {{ install_backend_network_name
         in (install_backend_network_list.stdout | from_json)['items']
         | map(attribute='name') | list }}
  run_once: true

# Configure backend network if not already present
- name: Configure backend network if not configured
  ansible.builtin.command:
    cmd: >
      om cluster config update
      --set network#{{ install_backend_network_name }}.type=routed_bridge
      --set network#{{ install_backend_network_name }}.network={{ install_backend_network_subnet_range }}
      --set network#{{ install_backend_network_name }}.mask_per_node={{ install_backend_network_subnet_mask_per_node }}
      --set network#{{ install_backend_network_name }}.tunnel={{ install_backend_network_tunnel }}
  run_once: true
  register: install_backend_network_output
  changed_when: install_backend_network_output.rc == 0
  when:
    - not install_backend_network_created
