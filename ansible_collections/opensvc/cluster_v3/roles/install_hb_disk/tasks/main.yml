---
# tasks file for install_hb_disk
#
# The disk is checked on every node of the heartbeat before the heartbeat
# is configured, and signed once, from one node, when it is not signed yet.
# A disk already signed may be shared with other clusters: it is not signed
# again, which would make their nodes lose their slots.

- name: Check the heartbeat parameters
  ansible.builtin.assert:
    that:
      - install_hb_disk_rid | string is match('^[A-Za-z0-9_-]+$')
      - install_hb_disk_state in ['present', 'absent']
      - install_hb_disk_max_slots | string is match('^([0-9]+)?$')
    fail_msg: >-
      install_hb_disk_rid must be set, made of letters, digits, - and _,
      install_hb_disk_state must be present or absent, and
      install_hb_disk_max_slots must be empty or a number
    quiet: true
  run_once: true

# om names the nodes by their lowercased short hostname
- name: Get the node names
  ansible.builtin.setup:
    gather_subset: [min]
  when: ansible_facts['hostname'] is not defined

- name: Get the cluster configuration
  ansible.builtin.command: om cluster config show
  register: install_hb_disk_config_show
  changed_when: false
  run_once: true

# section => {keyword: value}, from the ini text
- name: Parse the cluster configuration
  ansible.builtin.set_fact:
    install_hb_disk_config: >-
      {%- set out = {} -%}
      {%- set ns = namespace(section='') -%}
      {%- for line in install_hb_disk_config_show.stdout_lines -%}
      {%- if line[:1] == '[' and ']' in line -%}
      {%- set ns.section = line[1 : line.index(']')] -%}
      {%- set _ = out.update({ns.section: {}}) -%}
      {%- elif ns.section and line is match('^[^#;=]+=') -%}
      {%- set kv = line.split('=', 1) -%}
      {%- set _ = out[ns.section].update({kv[0] | trim: kv[1] | trim}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}
    install_hb_disk_section: "hb#{{ install_hb_disk_rid }}"
  run_once: true

- name: Remove the heartbeat
  ansible.builtin.command:
    argv:
      - om
      - cluster
      - config
      - update
      - "--delete={{ install_hb_disk_section }}"
  register: install_hb_disk_delete
  changed_when: install_hb_disk_delete.rc == 0
  run_once: true
  when:
    - install_hb_disk_state == 'absent'
    - install_hb_disk_section in install_hb_disk_config

- name: Configure the heartbeat
  when: install_hb_disk_state == 'present'
  block:
    # node name => disk path, from the host variables of the play hosts
    - name: Set the heartbeat facts
      ansible.builtin.set_fact:
        install_hb_disk_cluster_nodes: "{{ _cluster_nodes }}"
        install_hb_disk_hb_nodes: >-
          {{ install_hb_disk_nodes | map('lower') | list
             if install_hb_disk_nodes | length > 0 else _cluster_nodes }}
        install_hb_disk_devs: >-
          {%- set out = {} -%}
          {%- for h in ansible_play_hosts -%}
          {%- if hostvars[h].install_hb_disk_dev | default('') -%}
          {%- set _ = out.update({
                hostvars[h].ansible_facts.hostname | lower:
                hostvars[h].install_hb_disk_dev}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
        install_hb_disk_hosts: >-
          {{ dict(ansible_play_hosts
                  | map('extract', hostvars, ['ansible_facts', 'hostname'])
                  | map('lower') | zip(ansible_play_hosts)) }}
        install_hb_disk_max_slots_value: >-
          {{ install_hb_disk_max_slots | string or '1024' }}
      vars:
        _cluster_nodes: >-
          {{ install_hb_disk_config.cluster.nodes | default('') | split }}
      run_once: true

    - name: Check the heartbeat setup
      ansible.builtin.assert:
        that:
          - _current.type | default('disk') == 'disk'
          - _unknown | length == 0
          - _missing | length == 0
          - _current.max_slots | default('1024')
            == install_hb_disk_max_slots_value
        fail_msg: >-
          {{ install_hb_disk_section }}:
          {{ 'it is a ' ~ _current.type ~ ' heartbeat. '
             if _current.type | default('disk') != 'disk' else '' }}
          {{- 'not cluster nodes: ' ~ _unknown | join(', ') ~ '. '
              if _unknown else '' }}
          {{- 'no play host with install_hb_disk_dev for the nodes: '
              ~ _missing | join(', ') ~ '. ' if _missing else '' }}
          {{- 'max_slots is ' ~ _current.max_slots | default('1024')
              ~ ', it must not change once the disk is in use.'
              if _current.max_slots | default('1024')
                 != install_hb_disk_max_slots_value else '' }}
        quiet: true
      vars:
        _current: >-
          {{ install_hb_disk_config[install_hb_disk_section]
             | default({}) }}
        _unknown: >-
          {{ install_hb_disk_hb_nodes
             | difference(install_hb_disk_cluster_nodes) }}
        _missing: >-
          {{ install_hb_disk_hb_nodes
             | difference(install_hb_disk_devs.keys() | list) }}
      run_once: true

    - name: Check the disk on each node of the heartbeat
      when: ansible_facts.hostname | lower in install_hb_disk_hb_nodes
      block:
        - name: Get the disk type
          ansible.builtin.stat:
            path: "{{ install_hb_disk_dev }}"
            follow: true
          register: install_hb_disk_stat

        - name: Check the disk is a block device
          ansible.builtin.assert:
            that: install_hb_disk_stat.stat.isblk | default(false)
            fail_msg: "{{ install_hb_disk_dev }} is not a block device"
            quiet: true

        - name: Get the disk usage
          ansible.builtin.command:
            argv: [lsblk, -n, -r, -o, "NAME,MOUNTPOINT",
                   "{{ install_hb_disk_dev }}"]
          register: install_hb_disk_lsblk
          changed_when: false

        - name: Get the disk size
          ansible.builtin.command:
            argv: [blockdev, --getsize64, "{{ install_hb_disk_dev }}"]
          register: install_hb_disk_size
          changed_when: false

        - name: Get the disk identity
          ansible.builtin.command:
            argv: [udevadm, info, --query=property,
                   "--name={{ install_hb_disk_dev }}"]
          register: install_hb_disk_udev
          changed_when: false

        # rc 2: no signature found
        - name: Get the known signatures of the disk
          ansible.builtin.command:
            argv: [blkid, -p, -o, export, "{{ install_hb_disk_dev }}"]
          register: install_hb_disk_blkid
          changed_when: false
          failed_when: install_hb_disk_blkid.rc not in [0, 2]

        # read from the disk, not from the cache, as the heartbeats do
        - name: Get the disk header
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              dd if={{ install_hb_disk_dev | quote }} bs=4096 count=1
              iflag=direct status=none | od -An -tx1 -v -w4096
            executable: /bin/bash
          register: install_hb_disk_header
          changed_when: false

        # the slots are allocated in the metadata area, which must be blank
        # on a disk not signed. rc 1: not blank.
        - name: Check the metadata area of the disk is blank
          ansible.builtin.shell:
            cmd: >-
              set -o pipefail;
              dd if={{ install_hb_disk_dev | quote }} bs=4096
              count={{ install_hb_disk_max_slots_value }}
              iflag=direct status=none
              | cmp -s -n {{ install_hb_disk_max_slots_value | int * 4096 }}
              - /dev/zero
            executable: /bin/bash
          register: install_hb_disk_meta
          changed_when: false
          failed_when: install_hb_disk_meta.rc not in [0, 1]

        # the heartbeat signature is at offset 4, the legacy one at 0
        - name: Set the disk facts
          ansible.builtin.set_fact:
            install_hb_disk_id: >-
              {{ _udev.DM_UUID | default(_udev.ID_WWN_WITH_EXTENSION)
                 | default(_udev.ID_WWN) | default(_udev.ID_SERIAL)
                 | default('') }}
            install_hb_disk_kind: >-
              {{ 'signed' if _hex[8:24] == _magic
                 else 'legacy' if _hex[:16] == _magic
                 else 'blank' if _hex is match('^0*$')
                                 and install_hb_disk_meta.rc == 0
                 else 'data' }}
            install_hb_disk_uuid: "{{ _hex[48:80] }}"
          vars:
            _magic: 3dc13c87c05be3b6
            _hex: >-
              {{ install_hb_disk_header.stdout | replace(' ', '') | trim }}
            _udev: >-
              {{ dict(install_hb_disk_udev.stdout_lines
                      | select('match', '^[A-Z_]+=')
                      | map('split', '=', 1)) }}

        - name: Check the disk is free
          ansible.builtin.assert:
            that:
              - _children | length == 0
              - _mounted | length == 0
              - install_hb_disk_size.stdout | int >= _size | int
              - install_hb_disk_force | bool or install_hb_disk_id | length > 0
              - install_hb_disk_force | bool
                or install_hb_disk_kind != 'data'
              - install_hb_disk_force | bool
                or install_hb_disk_blkid.rc == 2
            fail_msg: >-
              {{ install_hb_disk_dev }}:
              {{ 'used by ' ~ _children | join(', ') ~ '. '
                 if _children else '' }}
              {{- 'mounted on ' ~ _mounted | join(', ') ~ '. '
                  if _mounted else '' }}
              {{- 'smaller than ' ~ _size ~ ' bytes. '
                  if install_hb_disk_size.stdout | int < _size | int else '' }}
              {{- 'not identified by udev. ' if not install_hb_disk_id
                  else '' }}
              {{- 'it holds data. ' if install_hb_disk_kind == 'data'
                  else '' }}
              {{- 'it holds a ' ~ [_blkid.TYPE | default(''),
                                   _blkid.PTTYPE | default('')]
                  | select | join(' ') ~ ' signature. '
                  if install_hb_disk_blkid.rc == 0 else '' }}
              {{- 'Set install_hb_disk_force to sign it anyway.'
                  if (not install_hb_disk_id
                      or install_hb_disk_kind == 'data'
                      or install_hb_disk_blkid.rc == 0) else '' }}
            quiet: true
          vars:
            # the metadata, then a 1MiB slot per node from the slot 1
            _size: >-
              {{ install_hb_disk_max_slots_value | int * 4096
                 + (install_hb_disk_hb_nodes | length + 1) * 1048576 }}
            _lines: "{{ install_hb_disk_lsblk.stdout_lines }}"
            _children: >-
              {{ _lines[1:] | map('split') | map('first') | list }}
            _mounted: >-
              {{ _lines | map('split') | map('join', ' ')
                 | select('search', ' ')
                 | map('regex_replace', '^[^ ]+ ', '') | list }}
            _blkid: >-
              {{ dict(install_hb_disk_blkid.stdout_lines
                      | select('match', '^[A-Z_]+=')
                      | map('split', '=', 1)) }}

    # node => [identity, header kind, uuid]
    - name: Check every node sees the same disk
      ansible.builtin.assert:
        that:
          - _seen.values() | map(attribute='0') | unique | length == 1
            or install_hb_disk_force | bool
          - _seen.values() | map(attribute='1') | unique | length == 1
          - _seen.values() | map(attribute='2') | unique | length == 1
            or _seen.values() | map(attribute='1') | first != 'signed'
        fail_msg: >-
          the nodes do not see the same disk, or see it differently:
          {{ _seen }}
        quiet: true
      vars:
        _seen: >-
          {%- set out = {} -%}
          {%- for h in ansible_play_hosts -%}
          {%- set n = hostvars[h].ansible_facts.hostname | lower -%}
          {%- if n in install_hb_disk_hb_nodes -%}
          {%- set _ = out.update({n: [hostvars[h].install_hb_disk_id,
                hostvars[h].install_hb_disk_kind,
                hostvars[h].install_hb_disk_uuid]}) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ out }}
      run_once: true

    # the same path everywhere is set once, else scoped to each node
    - name: Set the desired heartbeat keywords
      ansible.builtin.set_fact:
        install_hb_disk_desired: >-
          {%- set s = install_hb_disk_section ~ '.' -%}
          {%- set out = [s ~ 'type=disk'] -%}
          {%- for kw in ['max_slots', 'timeout', 'interval'] -%}
          {%- set v = lookup('vars', 'install_hb_disk_' ~ kw) | string -%}
          {%- if v -%}{%- set _ = out.append(s ~ kw ~ '=' ~ v) -%}{%- endif -%}
          {%- endfor -%}
          {%- if install_hb_disk_nodes -%}
          {%- set _ = out.append(s ~ 'nodes='
                ~ install_hb_disk_hb_nodes | join(' ')) -%}
          {%- endif -%}
          {%- if _paths | length == 1 -%}
          {%- set _ = out.append(s ~ 'dev=' ~ _paths | first) -%}
          {%- else -%}
          {%- for n in install_hb_disk_hb_nodes -%}
          {%- set _ = out.append(s ~ 'dev@' ~ n ~ '='
                ~ install_hb_disk_devs[n]) -%}
          {%- endfor -%}
          {%- endif -%}
          {{ out }}
        install_hb_disk_stale: >-
          {{ _current.keys()
             | select('match', '^dev@' if _paths | length == 1 else '^dev$')
             | map('regex_replace', '^', install_hb_disk_section ~ '.')
             | list }}
      vars:
        _paths: >-
          {{ install_hb_disk_hb_nodes | map('extract', install_hb_disk_devs)
             | unique }}
        _current: >-
          {{ install_hb_disk_config[install_hb_disk_section]
             | default({}) }}
      run_once: true

    - name: Get the current heartbeat keywords
      ansible.builtin.command:
        argv: >-
          {{ ['om', 'cluster', 'config', 'get', '-o', 'json']
             + (install_hb_disk_desired
                | map('regex_replace', '=.*$', '')
                | map('regex_replace', '^', '--kw=') | list) }}
      register: install_hb_disk_current
      changed_when: false
      run_once: true

    - name: Configure the heartbeat keywords
      ansible.builtin.command:
        argv: >-
          {{ ['om', 'cluster', 'config', 'update']
             + (_updates | map('regex_replace', '^', '--set=') | list)
             + (install_hb_disk_stale
                | map('regex_replace', '^', '--unset=') | list) }}
      register: install_hb_disk_update
      changed_when: install_hb_disk_update.rc == 0
      run_once: true
      when: _updates | length > 0 or install_hb_disk_stale | length > 0
      vars:
        _items: "{{ (install_hb_disk_current.stdout | from_json)['items'] }}"
        _current: >-
          {{ _items | map(attribute='keyword')
             | zip(_items | map(attribute='value'))
             | map('join', '=') | list }}
        _updates: "{{ install_hb_disk_desired | difference(_current) }}"

    # a forced disk may hold data in the metadata area, where the nodes
    # would find garbage instead of free slots
    - name: Clear the metadata area of the disk
      ansible.builtin.command:
        argv:
          - dd
          - if=/dev/zero
          - "of={{ install_hb_disk_dev }}"
          - bs=4096
          - "count={{ install_hb_disk_max_slots_value }}"
          - oflag=direct,sync
          - status=none
      register: install_hb_disk_clear
      changed_when: install_hb_disk_clear.rc == 0
      when:
        - ansible_facts.hostname | lower == install_hb_disk_hb_nodes | first
        - install_hb_disk_kind == 'data'

    # the streams of a heartbeat on a disk not signed are suspended, and
    # resume once it is signed. The node signing it must configure the
    # heartbeat: retry while the configuration reaches it.
    - name: Sign the disk
      ansible.builtin.command:
        argv:
          - om
          - daemon
          - hb
          - sign
          - "{{ install_hb_disk_rid }}"
          - "--node={{ install_hb_disk_hb_nodes | first }}"
      register: install_hb_disk_sign
      changed_when: install_hb_disk_sign.rc == 0
      retries: 6
      delay: 5
      until: install_hb_disk_sign.rc == 0
      run_once: true
      when: >-
        hostvars[install_hb_disk_hosts[install_hb_disk_hb_nodes | first]]
        .install_hb_disk_kind in ['blank', 'data']

    - name: Wait for the heartbeat to beat on every node
      ansible.builtin.command: om daemon hb list -o json
      register: install_hb_disk_status
      changed_when: false
      failed_when: false
      retries: >-
        {{ (install_hb_disk_wait_timeout | int / 5) | round(0, 'ceil')
           | int }}
      delay: 5
      until: >-
        install_hb_disk_status.rc == 0
        and _items | rejectattr('state', 'equalto', 'running') | list
            | length == 0
        and _items | rejectattr('is_beating') | list | length == 0
        and _items | selectattr('id', 'match', '.*[.]rx$')
            | map(attribute='node') | unique | length == _count | int
        and _items | selectattr('id', 'match', '.*[.]tx$')
            | map(attribute='node') | unique | length == _count | int
      vars:
        _count: "{{ install_hb_disk_hb_nodes | length }}"
        _items: >-
          {{ (install_hb_disk_status.stdout | default('{}', true)
              | from_json)['items'] | default([])
             | selectattr('id', 'in', [install_hb_disk_section ~ '.rx',
                                       install_hb_disk_section ~ '.tx'])
             | selectattr('node', 'in', install_hb_disk_hb_nodes)
             | list }}
      run_once: true
      when: install_hb_disk_hb_nodes | length > 1

    - name: Check the heartbeat beats on every node
      ansible.builtin.assert:
        that: install_hb_disk_status is succeeded
        fail_msg: >-
          {{ install_hb_disk_section }} does not beat on every node after
          {{ install_hb_disk_wait_timeout }}s:
          {{ _items | map(attribute='id')
             | zip(_items | map(attribute='node'),
                   _items | map(attribute='state'),
                   _items | map(attribute='is_beating')
                   | map('ternary', 'beating', 'not beating'))
             | map('join', ' ') | join(', ') }}
        quiet: true
      vars:
        _items: >-
          {{ (install_hb_disk_status.stdout | default('{}', true)
              | from_json)['items'] | default([])
             | selectattr('id', 'in', [install_hb_disk_section ~ '.rx',
                                       install_hb_disk_section ~ '.tx'])
             | list }}
      run_once: true
      when: install_hb_disk_hb_nodes | length > 1
