---
# tasks file for install_dns

- name: Set fact on dns cfgmap creation
  ansible.builtin.set_fact:
    install_dns_cfg_created: true
  run_once: true

- name: Check for dns cfgmap existence
  ansible.builtin.command: om system/cfg/dns ls
  changed_when: false
  register: install_dns_cfgmap_query
  run_once: true
  failed_when: false

- name: Set fact according to actual dns cfgmap existence
  ansible.builtin.set_fact:
    install_dns_cfg_created: false
  run_once: true
  when:
    - install_dns_cfgmap_name not in install_dns_cfgmap_query.stdout

- name: Create dns cfgmap
  ansible.builtin.command: om {{ install_dns_cfgmap_name }} create
  register: install_dns_output
  changed_when: install_dns_output.rc == 0
  run_once: true
  when:
    - not install_dns_cfg_created

- name: Set dns cfgmap server key content
  ansible.builtin.command: om {{ install_dns_cfgmap_name }} add --key server --from {{ install_dns_cfg_server_template }}
  register: install_dns_output
  changed_when: install_dns_output.rc == 0
  run_once: true
  when:
    - not install_dns_cfg_created

- name: Download recursor config file
  ansible.builtin.get_url:
    url: "{{ install_dns_cfg_recursor_template }}"
    dest: /tmp/recursor
    mode: '0600'
  run_once: true
  when:
    - not install_dns_cfg_created

- name: Modify allow-from parameter from recursor config file
  ansible.builtin.lineinfile:
    path: /tmp/recursor
    state: present
    regexp: '^(allow-from=.*)$'
    line: '\g<1>,{{ install_dns_cfg_recursor_allowed_subnets }}'
    backrefs: true
  run_once: true
  when:
    - not install_dns_cfg_created

- name: Set dns cfgmap recursor key content
  ansible.builtin.command: om {{ install_dns_cfgmap_name }} add --key recursor --from /tmp/recursor
  register: install_dns_output
  changed_when: install_dns_output.rc == 0
  run_once: true
  when:
    - not install_dns_cfg_created

- name: Set dns cfgmap configure key content
  ansible.builtin.command: om {{ install_dns_cfgmap_name }} add --key configure --from {{ install_dns_cfg_configure_template }}
  register: install_dns_output
  changed_when: install_dns_output.rc == 0
  run_once: true
  when:
    - not install_dns_cfg_created

- name: Set fact on dns service creation
  ansible.builtin.set_fact:
    install_dns_svc_created: true
  run_once: true

- name: Check for dns svc existence
  ansible.builtin.command: om {{ install_dns_service_name }} ls
  changed_when: false
  register: install_dns_svc_query
  run_once: true
  failed_when: false

- name: Set fact according to actual dns svc existence
  ansible.builtin.set_fact:
    install_dns_svc_created: false
  run_once: true
  when:
    - install_dns_service_name not in install_dns_svc_query.stdout

- name: Build dict with nodes ip addr
  ansible.builtin.set_fact:
    install_dns_ipv4_dict: "{{ dict(ansible_play_hosts | zip(_ipv4)) }}"
  vars:
    _ipv4: "{{ ansible_play_hosts |
               map('extract', hostvars, ['ansible_facts', 'default_ipv4', 'address']) |
               list }}"
  run_once: true
  when:
    - not install_dns_use_ip_from_ansible_host

- name: Build dict with ansible_host ip addr
  ansible.builtin.set_fact:
    install_dns_ipv4_dict: "{{ dict(ansible_play_hosts | zip(_ipv4)) }}"
  vars:
    _ipv4: "{{ ansible_play_hosts | map('extract', hostvars, 'ansible_facts', 'host') | list }}"
  run_once: true
  when:
    - install_dns_use_ip_from_ansible_host

- name: Debug dns dict
  ansible.builtin.debug:
    var: install_dns_ipv4_dict
  run_once: true
  when:
    - not install_dns_svc_created

- name: Check if vip is present
  ansible.builtin.command: om system/svc/vip config eval --kw ip#0.name
  failed_when: false
  changed_when: false
  register: install_dns_check_vip_output
  when: not install_dns_svc_created

- name: Set install_dns_cluster_has_vip based on install_dns_check_vip_output.stdout
  ansible.builtin.set_fact:
    install_dns_cluster_has_vip: "{{ (install_dns_check_vip_output.stdout | default('')) | length > 0 }}"
  when: install_dns_check_vip_output is defined

- name: Set default install_dns_cluster_has_vip if not defined
  ansible.builtin.set_fact:
    install_dns_cluster_has_vip: false
  when: install_dns_cluster_has_vip is not defined

- name: Debug install_dns_cluster_has_vip
  ansible.builtin.debug:
    msg: "VIP is present in the output."
  when: install_dns_cluster_has_vip | bool
  run_once: false

- name: Generate DNS resolvers list for each node (with vip)
  ansible.builtin.set_fact:
    install_dns_list: >
      {{
        [install_dns_check_vip_output.stdout] +
        [install_dns_ipv4_dict[inventory_hostname]] +
        (install_dns_ipv4_dict.values() | list | reject('equalto', install_dns_ipv4_dict[inventory_hostname]) | list)
      }}
  run_once: false
  when:
    - install_dns_cluster_has_vip

- name: Generate DNS resolvers list for each node (without vip)
  ansible.builtin.set_fact:
    install_dns_list: >
      {{
        [install_dns_ipv4_dict[inventory_hostname]] +
        (install_dns_ipv4_dict.values() | list | reject('equalto', install_dns_ipv4_dict[inventory_hostname]) | list)
      }}
  run_once: false
  when:
    - not install_dns_cluster_has_vip

- name: Convert DNS resolvers list to a space-separated string
  ansible.builtin.set_fact:
    install_dns_list_string: "{{ install_dns_list | join(' ') }}"
  run_once: false

- name: Debug dns list
  ansible.builtin.debug:
    var: install_dns_list_string
  run_once: false
  when:
    - not install_dns_svc_created

- name: Configure cluster dns thread
  ansible.builtin.shell:
    cmd: |
      om cluster config update --set 'cluster.dns@{{ ansible_hostname }}={{ install_dns_list_string }}'
      sleep 5
  args:
    executable: /bin/bash
  register: install_dns_output
  changed_when: install_dns_output.rc == 0
  run_once: false
  throttle: 1
  when:
    - not install_dns_svc_created

- name: Check for dns.cluster propagation before provisioning service
  ansible.builtin.shell: |
    set -o pipefail && om cluster config eval --kw cluster.dns -o json | jq -r '.items[0].evaluated | join(" ")'
  args:
    executable: /bin/bash
  changed_when: false
  register: install_dns_command_result
  retries: 20
  delay: 2
  until: install_dns_list_string in install_dns_command_result.stdout
  when:
    - install_dns_nodecount|int > 1
    - not install_dns_svc_created

- name: Deploy dns service
  ansible.builtin.command: om {{ install_dns_service_name }} deploy --config {{ install_dns_svc_template }}
  register: install_dns_output
  changed_when: install_dns_output.rc == 0
  run_once: true
  when:
    - not install_dns_svc_created

- name: Wait for dns service
  ansible.builtin.command: |
    om node event --wait --filter {{ osvcfilter }} --duration 60s -o json
  changed_when: false
  run_once: true
  vars:
    osvcfilter: >
      'InstanceStatusUpdated,node={{ ansible_play_hosts[0] }},path={{ install_dns_service_name
      }},.instance_status.avail="up",.instance_status.provisioned="true"'
  when:
    - not install_dns_svc_created
