---
# defaults file for provision_cluster
#
# opensvc delay to introduce between commands
provision_cluster_opensvc_command_delay: 3

# opensvc_server package repositories
provision_cluster_repoenv: "prod"
provision_cluster_repoarch: >-
  {%
    if ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    %}amd64{%
    else
    %}x86_64{%
    endif
  %}
provision_cluster_repocomponents: "main"
provision_cluster_repopath: >-
  {%
    if ansible_facts['distribution'] in ['Ubuntu', 'Debian']
    %}{{ provision_cluster_repoenv }}-opensvc-v3-{{ ansible_facts['distribution_release'] | trim }}{%
    elif ansible_facts['distribution'] in ['RedHat', 'CentOS']
    %}{{ provision_cluster_repoenv }}-opensvc-v3-rhel{{ ansible_facts['distribution_major_version'] | trim }}{%
    elif ansible_facts['distribution'] == 'SLES'
    %}{{ provision_cluster_repoenv }}-opensvc-v3-sles{{ ansible_facts['distribution_major_version'] | trim }}{%
    else
    %}{{ provision_cluster_repoenv }}-opensvc-v3{%
    endif
  %}
provision_cluster_repositories:
  RedHat:
    default: "https://packages.opensvc.com/rpm/{{ provision_cluster_repoenv }}-opensvc-v3-rhel9/{{ provision_cluster_repoarch }}/"
    7: "https://packages.opensvc.com/rpm/{{ provision_cluster_repoenv }}-opensvc-v3-rhel7/{{ provision_cluster_repoarch }}/"
    8: "https://packages.opensvc.com/rpm/{{ provision_cluster_repoenv }}-opensvc-v3-rhel8/{{ provision_cluster_repoarch }}/"
    9: "https://packages.opensvc.com/rpm/{{ provision_cluster_repoenv }}-opensvc-v3-rhel9/{{ provision_cluster_repoarch }}/"
    10: "https://packages.opensvc.com/rpm/{{ provision_cluster_repoenv }}-opensvc-v3-rhel10/{{ provision_cluster_repoarch }}/"
  Debian:
    default: "https://packages.opensvc.com/apt/debian/"
  Ubuntu:
    default: "https://packages.opensvc.com/apt/ubuntu/"
  Sles:
    default: "https://packages.opensvc.com/rpm/{{ provision_cluster_repoenv }}-opensvc-v3-sles15/x86_64/"
    15: "https://packages.opensvc.com/rpm/{{ provision_cluster_repoenv }}-opensvc-v3-sles15/x86_64/"

provision_cluster_repositories_gpgkey_url: 'https://packages.opensvc.com/gpg.public.key.asc'

provision_cluster_package_name: "opensvc-server"

# opensvc version to install, ex: 3.0.0~rc40.0.g2bb1b2a8a
# empty value installs the latest version available in the repository
provision_cluster_version: ""

# allow installing an older version than the one already installed
provision_cluster_allow_downgrade: false

# seconds to wait for all nodes to rejoin the cluster after a downgrade,
# before thawing the cluster frozen for the downgrade
provision_cluster_rejoin_timeout: 300

# set to something unique
provision_cluster_clustername: demo

# time waited before considering hb as down
provision_cluster_hb_timeout: 20s

# update /etc/hosts to add each cluster node ip
# false: you deal with this setup by yourself
# true: you expect the playbook to do the config
provision_cluster_update_etc_hosts: false

# depending on your cluster setup, you may need to disable default docker behavior with iptables
# if false, do not change /etc/docker/daemon.json config file
# if true, override /etc/docker/daemon.json content with iptables=false
provision_cluster_deploy_docker_daemon_json: false

# when docker daemon config deployment is enabled, we need to restart the docker service
provision_cluster_systemd_docker_unit: 'docker.service'

# configure the cluster virtual ip
# recommended for stretched vlans setup
# clients can connect to webapp/api using this floating ip
provision_cluster_configure_vip: false
provision_cluster_vip_name: '1.2.3.4'
provision_cluster_vip_dev: ''
provision_cluster_vip_netmask: '24'
provision_cluster_vip_template: 'https://raw.githubusercontent.com/opensvc/opensvc_templates/refs/heads/main/vip/vip.conf'

# configure cluster ssh trust between nodes
# must be done either by collection or manually
provision_cluster_configure_ssh_trust: false
