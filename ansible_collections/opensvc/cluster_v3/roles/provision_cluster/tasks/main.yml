---
# Tasks file for provision_cluster

- name: Distribution
  ansible.builtin.debug:
    msg: "{{ ansible_facts['distribution'] }}"
    verbosity: 2

- name: Distribution version
  ansible.builtin.debug:
    msg: "{{ ansible_facts['distribution_version'] }}"
    verbosity: 2

- name: Distribution major version
  ansible.builtin.debug:
    msg: "{{ ansible_facts['distribution_major_version'] }}"
    verbosity: 2

# Ubuntu has its own repository, the other distributions use the one of
# their family: Debian, RedHat or Sles (Suse)
- name: Set OS family used to select the tasks and the repository
  ansible.builtin.set_fact:
    provision_cluster_os: >-
      {{ 'Ubuntu' if ansible_facts['distribution'] == 'Ubuntu'
         else 'Sles' if ansible_facts['os_family'] == 'Suse'
         else ansible_facts['os_family'] }}

- name: Check the OS family is supported
  ansible.builtin.assert:
    that:
      - provision_cluster_os in ['Ubuntu', 'Debian', 'RedHat', 'Sles']
      - provision_cluster_os in provision_cluster_repositories
    fail_msg: >-
      unsupported distribution {{ ansible_facts['distribution'] }}
      (os family {{ ansible_facts['os_family'] }})
    quiet: true

# the version keys may be integers or strings
- name: Set repository URL based on OS and version
  ansible.builtin.set_fact:
    provision_cluster_opensvc_repo_url: >-
      {{ _repos[_major | int] | default(_repos[_major])
         | default(_repos['default']) | trim }}
  vars:
    _repos: "{{ provision_cluster_repositories[provision_cluster_os] }}"
    _major: "{{ ansible_facts['distribution_major_version'] | string }}"

- name: Debug repository url
  ansible.builtin.debug:
    msg: "{{ provision_cluster_opensvc_repo_url }}"
    verbosity: 2

- name: Debug repository path
  ansible.builtin.debug:
    msg: "{{ provision_cluster_repopath }}"
    verbosity: 2

- name: Debug package name
  ansible.builtin.debug:
    msg: "{{ provision_cluster_package_name }}"
    verbosity: 2

# the client is pinned too, as the server only recommends an unversioned client
- name: Set opensvc packages to install
  ansible.builtin.set_fact:
    provision_cluster_packages: >-
      {{ [provision_cluster_package_name] if provision_cluster_version | length == 0
         else [provision_cluster_package_name, 'opensvc-client']
              | map('regex_replace', '$', _sep ~ provision_cluster_version ~ _glob)
              | list }}
  vars:
    # zypper takes a name=version capability, without wildcard
    _sep: "{{ '-' if ansible_facts['os_family'] == 'RedHat' else '=' }}"
    _glob: "{{ '' if ansible_facts['os_family'] == 'Suse' else '*' }}"

- name: Debug opensvc packages
  ansible.builtin.debug:
    msg: "{{ provision_cluster_packages }}"
    verbosity: 2

- name: Include OS variables
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yml"

########################## DOWNGRADE FREEZE ##########################

- name: Get installed packages before install
  ansible.builtin.package_facts:
    manager: auto
  when: provision_cluster_version | length > 0

# compare without the git hash and distribution suffix,
# ex: 3.0.0~rc41.0.g7d8c7d905+ubuntu26.04 is compared as 3.0.0~rc41.0
- name: Detect opensvc downgrade on this node
  ansible.builtin.set_fact:
    provision_cluster_downgrade: >-
      {{ provision_cluster_version | length > 0
         and 'opensvc-server' in ansible_facts.packages | default({})
         and (ansible_facts.packages['opensvc-server'][0].version | regex_replace('[.]g[0-9a-f]+.*$', '')
              is version(provision_cluster_version | regex_replace('[.]g[0-9a-f]+.*$', ''), '>')) }}

# checked here, as the dnf module downgrades despite allow_downgrade=false
# when the package name holds a version glob
- name: Refuse downgrade unless allowed
  ansible.builtin.assert:
    that:
      - not provision_cluster_downgrade | bool or provision_cluster_allow_downgrade | bool
    fail_msg: >-
      installed opensvc-server {{ ansible_facts.packages['opensvc-server'][0].version | default('') }}
      is newer than provision_cluster_version {{ provision_cluster_version }},
      set provision_cluster_allow_downgrade to true to downgrade
    quiet: true

- name: Detect opensvc downgrade in the cluster
  ansible.builtin.set_fact:
    provision_cluster_downgrade_cluster: >-
      {{ ansible_play_hosts | map('extract', hostvars)
         | map(attribute='provision_cluster_downgrade', default=false)
         | select | list | length > 0 }}

# the nodes frozen by an operator stay frozen after the downgrade
- name: Get the frozen nodes before downgrade
  ansible.builtin.command: 'om cluster status -o json'
  register: provision_cluster_prefreeze_status
  changed_when: false
  when:
    - provision_cluster_downgrade_cluster | bool
    - inventory_hostname == ansible_play_hosts[0]

- name: Freeze cluster before downgrade
  ansible.builtin.command: 'om cluster freeze --wait'
  register: provision_cluster_freeze_output
  changed_when: provision_cluster_freeze_output.rc == 0
  when:
    - provision_cluster_downgrade_cluster | bool
    - inventory_hostname == ansible_play_hosts[0]

- name: Deploy per OS prerequisites and install osvc package
  ansible.builtin.include_tasks:
    file: >-
      install-{{ 'Debian' if provision_cluster_os == 'Ubuntu'
                 else provision_cluster_os }}.yml

- name: Wait for monitor to be idle
  ansible.builtin.command: |
    om daemon events --filter 'NodeMonitorUpdated,node={{ ansible_facts['hostname'] }},.node_monitor.state="idle"' --wait --duration 15s --quiet
  changed_when: false

- name: Debug node count
  ansible.builtin.debug:
    var: provision_cluster_nodecount
    verbosity: 2

- name: Update /etc/hosts file
  ansible.builtin.blockinfile:
    dest: /etc/hosts
    content: "{{ lookup('template', 'templates/hosts.j2') }}"
    state: present
  when:
    - provision_cluster_update_etc_hosts | bool

# the cluster nodes log in as root with keys only. sshd keeps the first
# value it reads: set it in a sshd_config.d file read first when the main
# configuration includes them, which recent distributions do, else in the
# main configuration (/usr/etc/ssh/sshd_config on SLES without
# /etc/ssh/sshd_config)
- name: Allow the ssh root login with keys only
  when:
    - provision_cluster_configure_ssh_trust | bool
  block:
    - name: Find the sshd main configuration
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config
      register: provision_cluster_sshd_config_stat

    - name: Read the sshd main configuration
      ansible.builtin.slurp:
        src: >-
          {{ '/etc/ssh/sshd_config' if provision_cluster_sshd_config_stat.stat.exists
             else '/usr/etc/ssh/sshd_config' }}
      register: provision_cluster_sshd_config

    - name: Set the ssh root login in a sshd_config.d file
      ansible.builtin.copy:
        content: |
          # managed by the opensvc.cluster_v3.provision_cluster role
          PermitRootLogin prohibit-password
        dest: /etc/ssh/sshd_config.d/00-opensvc.conf
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd
      when: _includes
      vars:
        _includes: >-
          {{ provision_cluster_sshd_config.content | b64decode
             is search('(?mi)^\s*Include\s+/etc/ssh/sshd_config[.]d/[*][.]conf\s*$') }}

    # also when the drop-in exists: the main configuration may set it
    # before its Include line
    - name: Set the ssh root login in the sshd main configuration
      ansible.builtin.replace:
        dest: /etc/ssh/sshd_config
        regexp: '(?i)^PermitRootLogin\s+(yes|without-password|no)\s*$'
        replace: "PermitRootLogin prohibit-password"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd
      when: provision_cluster_sshd_config_stat.stat.exists

    - name: Get the sshd effective configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: provision_cluster_sshd_effective
      changed_when: false

    - name: Check the ssh root login is allowed with keys only
      ansible.builtin.assert:
        that:
          - _effective in ['prohibit-password', 'without-password']
        fail_msg: >-
          sshd PermitRootLogin is {{ _effective }}, set by a configuration
          file read before /etc/ssh/sshd_config.d/00-opensvc.conf
        quiet: true
      vars:
        _effective: >-
          {{ provision_cluster_sshd_effective.stdout_lines
             | select('match', '(?i)^permitrootlogin ') | first
             | split | last }}

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable sysrq trigger
  ansible.builtin.copy:
    content: "kernel.sysrq=1\n"
    dest: /etc/sysctl.d/99-opensvc-sysrq.conf
    mode: "0644"
  register: provision_cluster_sysrq_conf

# also on a node rebooted since, where a later sysctl.d file may win
- name: Get the running sysrq setting
  ansible.builtin.slurp:
    src: /proc/sys/kernel/sysrq
  register: provision_cluster_sysrq_running

- name: Apply the sysrq setting
  ansible.builtin.command: sysctl -p /etc/sysctl.d/99-opensvc-sysrq.conf
  changed_when: true
  when: >-
    provision_cluster_sysrq_conf is changed
    or provision_cluster_sysrq_running.content | b64decode | trim != '1'

########################## FIRST NODE ##########################

- name: Get current cluster name
  ansible.builtin.command: om cluster config get --kw cluster.name
  register: provision_cluster_name
  changed_when: false
  failed_when: false
  when:
    - inventory_hostname == ansible_play_hosts[0]

- name: Set cluster name
  ansible.builtin.command: "om cluster config update --set cluster.name={{ provision_cluster_clustername }}"
  register: provision_cluster_output
  changed_when: provision_cluster_output.rc == 0
  when:
    - inventory_hostname == ansible_play_hosts[0]
    - provision_cluster_name.stdout != provision_cluster_clustername

- name: Get cluster token on first node
  ansible.builtin.command: "om daemon auth --role join --duration 10m"
  register: provision_cluster_token
  changed_when: false
  failed_when: provision_cluster_token.rc != 0
  no_log: "{{ ansible_verbosity < 2 }}"
  run_once: true
  when:
    - provision_cluster_nodecount | int > 1

- name: Debug cluster token
  ansible.builtin.debug:
    msg: "Cluster join token: {{ provision_cluster_token.stdout }}"
    verbosity: 2
  when:
    - provision_cluster_nodecount | int > 1

########################## OTHER NODES ##########################

- name: Check other nodes are joined to a cluster
  ansible.builtin.command: om cluster config get --kw cluster.nodes
  register: provision_cluster_clusternodes
  changed_when: false
  failed_when: false
  run_once: true
  when:
    - provision_cluster_nodecount | int > 1

- name: Debug cluster nodes provision_cluster_output
  ansible.builtin.debug:
    var: provision_cluster_clusternodes.stdout
    verbosity: 2

# cluster.nodes is a space separated list of the om node names, which are
# the lowercased short hostnames
- name: Set joined status for nodes
  ansible.builtin.set_fact:
    provision_cluster_joined: >-
      {{ ansible_facts['hostname'] | lower
         in provision_cluster_clusternodes.stdout | lower | split }}
  when:
    - provision_cluster_nodecount | int > 1

- name: Debug joined status
  ansible.builtin.debug:
    msg: "Joined status: {{ provision_cluster_joined }}"
    verbosity: 2
  when:
    - provision_cluster_nodecount | int > 1

- name: Join other nodes to the cluster
  ansible.builtin.command: "{{ item }}"
  throttle: 1
  register: provision_cluster_output
  changed_when: provision_cluster_output.rc == 0
  failed_when: provision_cluster_output.rc != 0
  environment:
    OSVC_JOIN_TOKEN: "{{ hostvars[ansible_play_hosts[0]].provision_cluster_token.stdout }}"
  with_items:
    - om cluster join --node {{ hostvars[ansible_play_hosts[0]].ansible_facts['hostname'] }}
    - sleep {{ provision_cluster_opensvc_command_delay }}
  when:
    - provision_cluster_nodecount | int > 1
    - inventory_hostname != ansible_play_hosts[0]
    - not provision_cluster_joined

- name: Debug provision_cluster_output
  ansible.builtin.debug:
    var: provision_cluster_output
    verbosity: 2
  when:
    - provision_cluster_nodecount | int > 1
    - not provision_cluster_joined

# after a downgrade, the cluster stays frozen if a node did not rejoin
- name: Wait for all nodes to rejoin the cluster after downgrade
  ansible.builtin.command: 'om cluster status -o json'
  register: provision_cluster_rejoin_status
  changed_when: false
  retries: "{{ (provision_cluster_rejoin_timeout | int / 5) | round(0, 'ceil') | int }}"
  delay: 5
  until: >-
    provision_cluster_rejoin_status.rc == 0 and
    ((provision_cluster_rejoin_status.stdout | from_json).cluster.config.nodes
     | difference((provision_cluster_rejoin_status.stdout | from_json).cluster.node | dict2items
                  | selectattr('value.monitor.state', 'equalto', 'idle')
                  | map(attribute='key') | list)
     | length == 0)
  when:
    - provision_cluster_downgrade_cluster | bool
    - inventory_hostname == ansible_play_hosts[0]

# thaw only the nodes the role froze for the downgrade: the operator
# freezes are kept. A zero frozen_at timestamp means not frozen.
- name: Thaw the cluster after the downgrade
  when:
    - provision_cluster_freeze_output is changed
    - inventory_hostname == ansible_play_hosts[0]
  vars:
    _before: >-
      {{ (provision_cluster_prefreeze_status.stdout | from_json).cluster.node
         | dict2items
         | rejectattr('value.status.frozen_at', 'match', '0001-01-01')
         | map(attribute='key') | list }}
  block:
    - name: Get cluster status
      ansible.builtin.command: 'om cluster status -o json'
      register: provision_cluster_status
      changed_when: false

    - name: Unfreeze the nodes frozen for the downgrade
      ansible.builtin.command:
        argv: [om, node, unfreeze, --node, "{{ _thaw | join(',') }}"]
      register: provision_cluster_output
      changed_when: provision_cluster_output.rc == 0
      when: _thaw | length > 0
      vars:
        _thaw: >-
          {{ (provision_cluster_status.stdout | from_json).cluster.node
             | dict2items
             | rejectattr('value.status.frozen_at', 'match', '0001-01-01')
             | map(attribute='key') | difference(_before) }}

    - name: Wait for the nodes to be unfrozen
      ansible.builtin.command: 'om cluster status -o json'
      register: provision_cluster_thaw_status
      changed_when: false
      retries: 12
      delay: 5
      until: >-
        (provision_cluster_thaw_status.stdout | from_json).cluster.node
        | dict2items
        | rejectattr('value.status.frozen_at', 'match', '0001-01-01')
        | map(attribute='key') | difference(_before) | length == 0

# om cluster ssh trust only appends missing entries, so compare file
# checksums to report whether it actually changed something
- name: Configure mutual root ssh trust
  when:
    - provision_cluster_nodecount | int > 1
    - provision_cluster_configure_ssh_trust | bool
  vars:
    provision_cluster_ssh_trust_files:
      - /root/.ssh/authorized_keys
      - /root/.ssh/known_hosts
  block:
    - name: Get ssh trust files state before trust
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ provision_cluster_ssh_trust_files }}"
      register: provision_cluster_ssh_trust_before

    - name: Add mutual root ssh trust
      ansible.builtin.command: 'om cluster ssh trust'
      changed_when: false
      run_once: true

    - name: Get ssh trust files state after trust
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ provision_cluster_ssh_trust_files }}"
      register: provision_cluster_ssh_trust_after

    - name: Report ssh trust changes
      ansible.builtin.debug:
        msg: "ssh trust files updated"
        verbosity: 1
      changed_when: >-
        provision_cluster_ssh_trust_before.results | map(attribute='stat.checksum', default='')
        != provision_cluster_ssh_trust_after.results | map(attribute='stat.checksum', default='')

- name: Configure cluster vip
  ansible.builtin.include_tasks: "vip.yml"
  when:
    - provision_cluster_configure_vip | bool

- name: Disable iptables usage by docker
  ansible.builtin.include_tasks: "docker.yml"
  when:
    - provision_cluster_deploy_docker_daemon_json | bool

- name: Get current hb timeout
  ansible.builtin.command: 'om cluster config get --kw hb#1.timeout'
  register: provision_cluster_hb_timeout_current
  changed_when: false
  run_once: true
  when:
    - provision_cluster_nodecount | int > 1

- name: Set hb timeout to {{ provision_cluster_hb_timeout }}
  ansible.builtin.command: 'om cluster config update --set hb#1.timeout={{ provision_cluster_hb_timeout }}'
  register: provision_cluster_hb_output
  changed_when: provision_cluster_hb_output.rc == 0
  run_once: true
  when:
    - provision_cluster_nodecount | int > 1
    - provision_cluster_hb_timeout_current.stdout | trim != provision_cluster_hb_timeout
