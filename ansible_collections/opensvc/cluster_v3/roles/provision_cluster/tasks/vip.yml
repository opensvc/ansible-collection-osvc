---
- name: Set fact on vip creation
  ansible.builtin.set_fact:
    provision_cluster_vip_created: true
  run_once: true

- name: Check for vip existence
  ansible.builtin.command: "om system/svc/vip ls"
  changed_when: false
  register: provision_cluster_svcvip
  run_once: true
  failed_when: false

- name: Set fact according to actual vip existence
  ansible.builtin.set_fact:
    provision_cluster_vip_created: false
  run_once: true
  when:
    - provision_cluster_svcvip.rc != 0 or provision_cluster_svcvip.stdout is not search('system/svc/vip')

# exact name match: grep -w also matches aliases like hb1-<hostname>
- name: Identify node ip used for production
  ansible.builtin.command: >-
    awk -v h={{ ansible_facts['hostname'] }}
    '$1 !~ /^(#|127\.|::1$)/ { for (i = 2; i <= NF && $i !~ /^#/; i++) if ($i == h) { print $1; exit } }'
    /etc/hosts
  changed_when: false
  register: provision_cluster_grepquery
  when:
    - not provision_cluster_vip_created
    - provision_cluster_vip_dev|length == 0

- name: Set fact according to command result
  ansible.builtin.set_fact:
    provision_cluster_osvc_node_prd_ip: "{{ provision_cluster_grepquery.stdout }}"
  when:
    - not provision_cluster_vip_created
    - provision_cluster_vip_dev|length == 0

- name: Identify node nic used for production
  ansible.builtin.shell: set -o pipefail && ip route ls | grep -wF {{ provision_cluster_osvc_node_prd_ip }} | head -1 | grep -Po '(?<=dev )(\S+)'
  args:
    executable: /bin/bash
  register: provision_cluster_iproutequery
  changed_when: false
  when:
    - not provision_cluster_vip_created
    - provision_cluster_vip_dev|length == 0

- name: Set fact according to command result
  ansible.builtin.set_fact:
    provision_cluster_node_prd_nic: "{{ provision_cluster_iproutequery.stdout }}"
  when:
    - not provision_cluster_vip_created
    - provision_cluster_vip_dev|length == 0

- name: Set fact according to custom device
  ansible.builtin.set_fact:
    provision_cluster_node_prd_nic: "{{ provision_cluster_vip_dev }}"
  when:
    - not provision_cluster_vip_created
    - provision_cluster_vip_dev|length > 0

- name: Ensure that provision_cluster_node_prd_nic is not empty
  ansible.builtin.assert:
    that: "provision_cluster_node_prd_nic|length > 0"
  when:
    - not provision_cluster_vip_created

- name: Deploy vip service from template
  ansible.builtin.command: |
    om system/svc/vip deploy --config {{ provision_cluster_vip_template }}
    --kw ip#0.name={{ provision_cluster_vip_name }}
    --kw ip#0.netmask={{ provision_cluster_vip_netmask }}
    --kw ip#0.dev={{ provision_cluster_node_prd_nic }}
    --wait
  register: provision_cluster_output
  changed_when: provision_cluster_output.rc == 0
  run_once: true
  when:
    - not provision_cluster_vip_created

- name: Set fact for filter expression
  ansible.builtin.set_fact:
    provision_cluster_filter_expression: >-
      'InstanceStatusUpdated,path=system/svc/vip,node={{ hostvars[ansible_play_hosts[0]].ansible_facts['hostname']
      }},.instance_status.overall="up"'
  when:
    - not provision_cluster_vip_created

- name: Debug filter expression
  ansible.builtin.debug:
    var: provision_cluster_filter_expression
    verbosity: 2
  when:
    - not provision_cluster_vip_created

- name: Wait for vip service instance to be spawned
  ansible.builtin.command: om daemon events --filter {{ provision_cluster_filter_expression }} --wait --duration 15s --quiet
  run_once: true
  changed_when: false
  when:
    - not provision_cluster_vip_created

- name: Unfreeze vip service
  ansible.builtin.command: 'om system/svc/vip unfreeze --wait'
  run_once: true
  register: provision_cluster_output
  changed_when: provision_cluster_output.rc == 0
  when:
    - not provision_cluster_vip_created
