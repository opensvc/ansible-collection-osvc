---
# handlers file for install_drbd
- name: Restart opensvc daemon
  ansible.builtin.command: 'om daemon restart'
  register: install_drbd_output
  changed_when: install_drbd_output.rc == 0

- name: Wait for restart to be terminated
  ansible.builtin.command: |
    om daemon events --filter 'NodeMonitorUpdated,node={{ ansible_facts['hostname'] }},.node_monitor.state="idle"' --wait --duration 120s --quiet
  register: install_drbd_output
  changed_when: install_drbd_output.rc == 0
