---

# EL7 has no dnf: let the package module pick yum
- name: Install common packages for rhel/centos/fedora (ver < 8)
  ansible.builtin.package:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - python36
      - python36-requests
      - python36-crypto
      - python36-cryptography
      - sg3_utils
      - psmisc
  when:
    - (ansible_facts['distribution_major_version']|int < 8)

- name: Install common packages for rhel/centos/fedora (ver > 8)
  ansible.builtin.dnf:
    name: "{{ packages }}"
    state: present
  vars:
    packages:
      - podman
      - psmisc
      - python3
      - python3-requests
      - python3-cryptography
      - sg3_utils
  when:
    - (ansible_facts['distribution_major_version']|int >= 8)
